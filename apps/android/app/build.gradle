plugins { id 'com.android.application' }
android {
    namespace 'dev.undivisible.background'
    compileSdk 35
    defaultConfig { applicationId 'dev.undivisible.background'; minSdk 33; targetSdk 35; versionCode 3; versionName '0.1.2' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('shaderAssets')
}
tasks.register('shaderAssets', Copy) {
    from('../../../src') { include 'field.frag', 'presets.json' }
    from('../../..') { include 'LICENSE', 'NOTICE.md' }
    into layout.buildDirectory.dir('shaderAssets')
}
tasks.named('preBuild').configure { dependsOn 'shaderAssets' }
