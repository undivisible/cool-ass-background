<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Background</title>
  <meta name="description" content="Background, a reusable music-colored shader for websites and live wallpapers.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="field" aria-hidden="true"></canvas>
  <main aria-label="Background">
    <section class="controls" aria-label="Shader controls">
      <label for="preset">Palette</label><select id="preset"></select>
      <div class="actions"><button id="next-track">Simulate next track</button><button id="mode" aria-pressed="true">ASCII on</button><button id="pause" aria-pressed="false">Pause</button></div>
      <p id="status" role="status"></p>
      <details><summary>Music sync</summary>
        <form id="lastfm"><label for="user">Last.fm username</label><input id="user" autocomplete="off" required><label for="key">Your Last.fm API key (not your password)</label><input id="key" autocomplete="off" required><div class="actions"><button>Connect Last.fm</button><button type="button" id="disconnect">Disconnect</button></div></form>
      </details>
    </section>
    <nav aria-label="Project links"><a href="https://github.com/undivisible/cool-ass-background#website-embed">Embed</a><a href="https://github.com/undivisible/cool-ass-background/releases">Downloads</a><a href="https://github.com/undivisible/cool-ass-background#wallpaper-setup">Setup</a><a href="demo.mp4">Video</a><a href="https://github.com/undivisible/cool-ass-background">Source</a></nav>
  </main>
  <script src="demo.js" defer></script>
</body>
</html>
